# Render Blueprint — https://render.com/docs/infrastructure-as-code
#
# Deploys the Express API gateway in web/backend. To use it: Render dashboard →
# New → Blueprint → pick this repository. Render reads this file, then prompts
# for the two secrets marked sync:false below.
#
# Everything else about the deployment lives in docs/deploy.md.

services:
  - type: web
    name: plant-doctor-pro-backend
    runtime: node
    plan: free

    # The repo holds firmware, frontend and backend; only this subtree is the service.
    rootDir: web/backend

    # ci, not install: build from package-lock.json exactly, and skip
    # devDependencies (nodemon is not wanted in production).
    buildCommand: npm ci --omit=dev
    startCommand: npm start

    # Answers without a secret, without a rate limit, and without touching the
    # database — exactly what a liveness probe should do.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # sync:false = Render asks for the value and stores it encrypted; it is
      # never written into this file. SUPABASE_KEY is the service-role secret,
      # and DEVICE_SECRET must match config.h on the Arduino.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DEVICE_SECRET
        sync: false

  # ---- Dashboard (static site) ----
  # Vite builds to dist/ and Render serves it from its CDN. The bundle contains
  # only VITE_-prefixed values: the project URL and the PUBLISHABLE key, both of
  # which are meant to be public. Row-level security is what protects the data,
  # so a visitor sees nothing until they log in.
  - type: web
    name: plant-doctor-pro-frontend
    runtime: static
    rootDir: web/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Public demo login (read-only account, see the 2026-11-17 demo
      # migration). Not secrets — they are shown on the login page — but kept
      # out of this file so the password can change without a commit.
      - key: VITE_DEMO_EMAIL
        sync: false
      - key: VITE_DEMO_PASSWORD
        sync: false
      # Mock mode bypasses the login gate entirely — never enable it here.
      - key: VITE_USE_MOCK
        value: "false"

    # Single-page app: every path has to return index.html, or a refresh on any
    # route the app adds later would 404 at the CDN before React ever loads.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
